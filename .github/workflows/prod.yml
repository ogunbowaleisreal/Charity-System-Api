name: 🚀 Deploy to DigitalOcean (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies and build
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # 3️⃣ Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      # 4️⃣ Deploy
      - name: Deploy to DigitalOcean
        run: |
          rsync -avz --delete ./dist \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/var/www/help-me-nigeria-backend/

          rsync -avz package.json package-lock.json \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/var/www/help-me-nigeria-backend/

          rsync -avz ecosystem.config.js \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/var/www/help-me-nigeria-backend/

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} << 'EOF'

            cd /var/www/help-me-nigeria-backend

            # Load NVM
            export NVM_DIR="$HOME/.nvm"

            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && . "$NVM_DIR/bash_completion"

            # Use correct Node version
            nvm use --lts

            # Install production dependencies
            npm ci --omit=dev

            # Reload app
            pm2 reload ecosystem.config.js --env production

            # Save PM2 state
            pm2 save

          EOF
