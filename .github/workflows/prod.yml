name: 🚀 Deploy to DigitalOcean (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies and build on GitHub Actions
      # ✅ Updated: Build happens here instead of on the server
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # 3️⃣ Setup SSH to the droplet
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DROPLET_IP }} >> ~/.ssh/known_hosts

      # 4️⃣ Deploy built files to the droplet
      - name: Deploy to DigitalOcean
        run: |
          # ✅ Updated: Upload prebuilt dist folder, not building on the server
          rsync -avz --delete ./dist ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/home/deploy/apps/help-me-nigeria-backend/

          # Upload package files (for production dependencies)
          rsync -avz package.json package-lock.json ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/home/deploy/apps/help-me-nigeria-backend/

          # ✅ Upload ecosystem.config.js so PM2 can reload
          rsync -avz ecosystem.config.js ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }}:/home/deploy/apps/help-me-nigeria-backend/

          # Install production dependencies and reload PM2
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_IP }} << 'EOF'
            cd /home/deploy/apps/help-me-nigeria-backend

            # Reload PM2 with new prebuilt code
            pm2 reload ecosystem.config.js --env production 
          EOF